name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the pinned environment
        run: uv sync --locked

      - name: Style
        run: make lint

      - name: Tests (known answers, random inputs, data, leakage)
        run: make test

      - name: Mini pipeline on fake data with the real column names
        run: make fake
