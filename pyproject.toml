[project]
name = "threshold"
version = "0.1.0"
description = "An onboarding decision engine: turns a fraud score into approve / verify / review / decline, priced in pounds and planned around review capacity."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "pyyaml>=6.0",
    "streamlit>=1.39",
    "plotly>=5.24",
    "matplotlib>=3.9",
    "kaggle>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threshold"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
ignore = [
    "E501",   # the formatter owns line length; what it leaves long is prose in strings
    "RUF001", # we write £ and – on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "B018"]
"app/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: runs the mini pipeline end to end"]
